services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=kukija_laravel
      - DB_USERNAME=kukija
      - DB_PASSWORD=secret
    networks:
      - kukija
    depends_on:
      - db

  db:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=kukija_laravel
      - MARIADB_USER=kukija
      - MARIADB_PASSWORD=secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kukija

  web:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kukija

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - kukija

networks:
  kukija:
    driver: bridge

volumes:
  db_data:
